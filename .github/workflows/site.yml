name: Check site build

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/build-site-data.mjs"
      - "papers_merged.jsonl"
      - "papers_detailed.jsonl"
      - "oss_repos.jsonl"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site-data.mjs"
      - "papers_merged.jsonl"
      - "papers_detailed.jsonl"
      - "oss_repos.jsonl"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
