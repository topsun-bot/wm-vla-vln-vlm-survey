      <text x="24" y="70" font-size="15" fill="#41465a">sensors ’ VLM / encoder</text>
      <text x="24" y="104" font-size="15" fill="#41465a">’ optional world-model rollouts</text>
      <text x="24" y="138" font-size="15" fill="#41465a">’ VLA / VLN policy or MPC</text>
      <text x="24" y="172" font-size="15" fill="#41465a">’ low-level controller</text>
      <text x="24" y="220" font-size="14" fill="#0f6b4f">Agent loop (optional, mid-rate):</text>
      <text x="24" y="248" font-size="14" fill="#41465a">decompose ’ call skill / VLA ’ verify ’ recover</text>
