<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Paper map</title>
  <desc id="desc">Survey tags split into World Model, VLA, VLN, VLM, and Agent-robot, with example papers from this pack.</desc>
  <rect width="1100" height="420" rx="20" fill="#ffffff"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="28" y="168" width="168" height="72" rx="14" fill="#e8f4ee"/>
    <text x="112" y="200" text-anchor="middle" font-size="15" font-weight="750" fill="#0a4b38">This survey</text>
    <text x="112" y="222" text-anchor="middle" font-size="12" fill="#41465a">WM × VLA/VLN/VLM</text>

    <path d="M196 204 H250" stroke="#0f6b4f" stroke-width="2"/>
    <path d="M250 70 V338 H280" stroke="#0f6b4f" stroke-width="2" fill="none"/>

    <g transform="translate(292 36)">
