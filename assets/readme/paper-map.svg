      <text x="16" y="44" font-size="12" fill="#41465a">DreamerV3 · Cosmos · OSCAR</text>
    </g>
    <g transform="translate(292 108)">
      <rect width="230" height="56" rx="12" fill="#e8eef6"/>
      <text x="16" y="24" font-size="14" font-weight="750" fill="#315f8f">VLA</text>
      <text x="16" y="44" font-size="12" fill="#41465a">OpenVLA · Octo · À€ / OpenPI</text>
    </g>
    <g transform="translate(292 180)">
      <rect width="230" height="56" rx="12" fill="#e3f5f2"/>
      <text x="16" y="24" font-size="14" font-weight="750" fill="#0f766e">VLN</text>
      <text x="16" y="44" font-size="12" fill="#41465a">VLN-CE · NavGPT · NaVILA</text>
    </g>
    <g transform="translate(292 252)">
